services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4300
      DATABASE_URL: postgresql://cloudkitchen:${POSTGRES_PASSWORD}@db:5432/cloudkitchen
      ASSET_BASE_URL: /assets
      APP_ID: ${APP_ID:-cloudkitchen-direct}
      OWNER_OPEN_ID: ${OWNER_OPEN_ID:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-}
      FEATURED_STOREFRONT_NAME: ${FEATURED_STOREFRONT_NAME:-}
      FEATURED_STOREFRONT_URL: ${FEATURED_STOREFRONT_URL:-}
      TRUSTED_PROXY: ${TRUSTED_PROXY:-0}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Kolkata}
      DEFAULT_DELIVERY_RADIUS_KM: ${DEFAULT_DELIVERY_RADIUS_KM:-5}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      LOCAL_ADMIN_TOKEN: ${LOCAL_ADMIN_TOKEN}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET}
      OTP_DEV_LOG_ENABLED: ${OTP_DEV_LOG_ENABLED:-false}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      SHADOWFAX_API_URL: ${SHADOWFAX_API_URL:-https://api.shadowfax.in}
      SHADOWFAX_API_KEY: ${SHADOWFAX_API_KEY:-}
      SHADOWFAX_MERCHANT_ID: ${SHADOWFAX_MERCHANT_ID:-}
      SHADOWFAX_WEBHOOK_SECRET: ${SHADOWFAX_WEBHOOK_SECRET:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      DOMAIN_CNAME_TARGET: ${DOMAIN_CNAME_TARGET:-cname.yourdomain.com}
    ports:
      - "127.0.0.1:4300:4300"
    volumes:
      - cloudkitchen_images:/app/images
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudkitchen
      POSTGRES_USER: cloudkitchen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - cloudkitchen_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudkitchen -d cloudkitchen"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  cloudkitchen_pgdata:
  # Uploaded brand/menu images must survive app recreates — without this
  # volume every redeploy wipes /app/images.
  cloudkitchen_images:
