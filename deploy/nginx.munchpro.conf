# =============================================================================
# MunchPro platform domain — Nginx Config for munchpro.in (+ www)
# Same upstream as the restaurant site. NOTE: no limit_req_zone lines here —
# those are defined once in the cloudkitchen site file; duplicating them
# fails `nginx -t`.
#
# VPS steps (after DNS A @ + www → server IP propagates):
#   sudo cp deploy/nginx.munchpro.conf /etc/nginx/sites-available/munchpro
#   sudo ln -sf /etc/nginx/sites-available/munchpro /etc/nginx/sites-enabled/munchpro
#   sudo certbot certonly --nginx -d munchpro.in -d www.munchpro.in \
#     --non-interactive --agree-tos --email "admin@munchpro.in"
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# Upstream (shared with restaurant site)
upstream munchpro {
    server 127.0.0.1:4300;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name munchpro.in www.munchpro.in;

    # Allow certbot challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name munchpro.in www.munchpro.in;

    # SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/munchpro.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/munchpro.in/privkey.pem;

    # Modern SSL config
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Max upload size (for menu import CSV)
    client_max_body_size 2M;

    # tRPC API
    location /api/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://munchpro;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout for long operations
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Webhook endpoints (higher rate for payment/delivery webhooks)
    location /api/trpc/storefront.razorpayWebhook {
        limit_req zone=webhook burst=20 nodelay;

        proxy_pass http://munchpro;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/trpc/storefront.shadowfaxWebhook {
        limit_req zone=webhook burst=20 nodelay;

        proxy_pass http://munchpro;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth callback
    location /api/auth/ {
        proxy_pass http://munchpro;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets with long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://munchpro;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Storage proxy (images)
    location /manus-storage/ {
        proxy_pass http://munchpro;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
    }

    # Everything else → SPA
    location / {
        proxy_pass http://munchpro;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
