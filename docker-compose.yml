# Quick local development:
#   1. Copy .env.example to .env and set POSTGRES_PASSWORD (or export it)
#   2. docker compose up -d
# Full VPS deployment: bash deploy/setup.sh
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudkitchen
      POSTGRES_USER: cloudkitchen
      # P0: never hardcode the password — must come from the environment.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file or environment}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudkitchen -d cloudkitchen"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
