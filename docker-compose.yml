# Quick local development: docker compose up -d
# Full VPS deployment: bash deploy/setup.sh
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudkitchen
      POSTGRES_USER: cloudkitchen
      POSTGRES_PASSWORD: devpassword123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudkitchen -d cloudkitchen"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
