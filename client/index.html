<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale: locking zoom breaks pinch-zoom accessibility (WCAG 1.4.4). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>MunchPro — Direct ordering for independent kitchens</title>
    <meta name="description" content="MunchPro gives local kitchens their own direct ordering counter — no marketplace commission, no lost customer list." />
    <meta name="theme-color" content="#B95509" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MunchPro" />
    <meta property="og:title" content="MunchPro — Direct ordering for independent kitchens" />
    <meta property="og:description" content="Order direct from your favourite kitchen. Live menu, honest pricing, server-verified payments." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/png" href="/assets/supperclub-mark.png" />
    <!-- Fonts: preconnect pair kept + display=swap (no FOIT). Stylesheet stays
         render-blocking for LCP text; fetchpriority=high hints the browser to
         prioritize it. No extra preloads/scripts: avoids added early connections
         on slow networks. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" fetchpriority="high" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
